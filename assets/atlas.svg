<text x="114.0" y="710.0" font-size="12" fill="#F0EBE3" text-anchor="start">61% of the languages pay more than double English&#x27;s rate; 17% pay more than four times. The steep right</text>
<text x="114.0" y="731.0" font-size="12" fill="#9A8FA6" text-anchor="start">wall is almost entirely non-Latin scripts: Ol Chiki, Tifinagh, Myanmar, Tibetan, Odia, Ge&#x27;ez. For them the tokenizer</text>
<text x="114.0" y="752.0" font-size="12" fill="#9A8FA6" text-anchor="start">falls back to spending roughly one token per byte, and their scripts cost three bytes per character in UTF-8.</text>
