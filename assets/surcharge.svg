<text x="114.0" y="740.0" font-size="10.5" fill="#9A8FA6" text-anchor="start" letter-spacing="1.8">WHY THIS ONE STINGS</text>
<text x="114.0" y="764.0" font-size="12" fill="#9A8FA6" text-anchor="start">The marks are not decoration: they are what makes Yoruba readable (my ami project restores them). Every tokenizer</text>
<text x="114.0" y="785.0" font-size="12" fill="#9A8FA6" text-anchor="start">here charges extra for the marked text, up to double under GPT-2, so the incentive runs against writing the language</text>
<text x="114.0" y="806.0" font-size="12" fill="#F0EBE3" text-anchor="start">correctly. A Yoruba speaker is taxed once for their language and a second time for their orthography.</text>
